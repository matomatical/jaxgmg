[project]
name = "jaxgmg"
version = "0.0.0"
authors = [
    { name="Matthew Farrugia-Roberts", email="matthew@far.in.net" },
]
description = "JAX-based environments and RL baselines for studying goal misgeneralisation."
readme = "README.md"
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]

requires-python = ">=3.10"
dependencies = [
    "jax",
    "imageio",
    "moviepy",
    "numpy",
    "einops",
    "chex",
    "jaxtyping",
    "flax",
    "distrax",
    "readchar",
    "typer",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
jaxgmg = "jaxgmg.cli.app:app"

[project.urls]
Homepage = "https://github.com/matomatical/jaxgmg"
Issues = "https://github.com/matomatical/jaxgmg/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jaxgmg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tier-1 correctness tests run on CPU (see notes/02-cleanup-plan.md). The CPU
# pin is also set in tests/conftest.py before JAX is imported.
filterwarnings = [
    "ignore:jax.core.pytype_aval_mappings is deprecated:DeprecationWarning",
]
xfail_strict = true

